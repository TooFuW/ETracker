<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="options.css">
        <title>EmailTracker Settings</title>
    </head>
    <body>
        <h1>EmailTracker settings</h1>

        <label for="apiUrl">Server URL</label>
        <input type="text" id="apiUrl" placeholder="https://your-domain.com">

        <label for="apiKey">API key</label>
        <input type="password" id="apiKey" placeholder="your-secret-api-key">

        <button id="save">Save</button>
        <p id="status"></p>

        <script src="options.js"></script>
    </body>
</html>
